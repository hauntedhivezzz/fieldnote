<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-title" content="Prep">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Field Notes</title>
<style>
:root{--bg:#f5f5f2;--card:#fff;--ink:#15191d;--muted:#5d6670;--line:#e4e1da;--acc:#2f5d7c;--press:#ecebe6;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121518;--card:#1b1f24;--ink:#ebe8e2;--muted:#a2aab2;--line:#2c3238;--acc:#7fb0d4;--press:#262b31;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121518;--card:#1b1f24;--ink:#ebe8e2;--muted:#a2aab2;--line:#2c3238;--acc:#7fb0d4;--press:#262b31;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
#lock{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 22px}
h1{margin:0 0 4px;font:700 28px/1.2 -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:15px;margin:0 0 18px}
input[type=password]{width:100%;font:inherit;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
label.rem{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--muted);margin:14px 0}
label.rem input{width:22px;height:22px}
button.go{width:100%;font:inherit;font-weight:600;padding:14px;border:0;border-radius:14px;background:var(--acc);color:#fff}
.err{color:#c0392b;font-size:14px;min-height:1.2em;margin-top:10px}
#app{display:none;height:100%;flex-direction:column}
#bar{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 4px) 8px 4px;background:var(--card);border-bottom:1px solid var(--line)}
#bar button{flex:none;width:48px;height:48px;display:grid;place-items:center;background:none;border:0;border-radius:14px;color:var(--ink);padding:0}
#bar button:active{background:var(--press)}
#bar button svg{width:27px;height:27px}
#bar button[hidden]{display:none}
#mid{flex:1;min-width:0;text-align:center;line-height:1.15}
#title{display:block;font-weight:650;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stamp{display:block;font-size:12px;color:var(--muted)}
#themeBtn{position:relative}
iframe{flex:1;width:100%;border:0;background:var(--bg)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);background:#222;color:#fff;font-size:15px;padding:10px 16px;border-radius:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
#toast.on{opacity:.95}
</style>
</head>
<body>
<div id="lock">
  <form class="box" id="form">
    <h1>Field Notes</h1>
    <p class="sub">Works offline once unlocked.</p>
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus>
    <label class="rem"><input type="checkbox" id="rem" checked> Stay unlocked on this phone</label>
    <button class="go" type="submit">Unlock</button>
    <div class="err" id="err"></div>
  </form>
</div>
<div id="app">
  <div id="bar"><button id="back" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><button id="home" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg></button><div id="mid"><span id="title"></span><span id="stamp"></span></div><button id="themeBtn" aria-label="Light or dark"></button></div>
  <iframe id="view" title="Page"></iframe>
</div>
<div id="toast"></div>
<script>
(function(){
  var KEYSTORE='prep.key.v1', pages=null, stack=[], meta=null, liveKey=null, current='home';
  // stack: [{n: page name, s: saved spot (scroll + open sections)}], so Back returns you to where you were.
  // One light/dark setting for the whole app. Field Tools pages and the inventory read the same keys.
  var TI={auto:'<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17A8.5 8.5 0 0 0 12 3.5z" fill="currentColor"/>',
    light:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/>',
    dark:'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>'};
  function theme(){ try{ var v=JSON.parse(localStorage.getItem('ft.theme')); return v==='light'||v==='dark'?v:'auto'; }catch(e){ return 'auto'; } }
  function setTheme(t){
    try{ localStorage.setItem('ft.theme',JSON.stringify(t)); if(t==='auto') localStorage.removeItem('twoWeeksReady.v1.theme'); else localStorage.setItem('twoWeeksReady.v1.theme',t); }catch(e){}
    if(t==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',t);
    document.getElementById('themeBtn').innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+TI[t]+'</svg>';
  }
  var HEAD="<script>try{var t=JSON.parse(localStorage.getItem('ft.theme'));if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}<\/script>"+
    "<style>.toprow,.printbar,#themeBtn{display:none!important}.top{padding-top:16px!important}<\/style>";
  function inject(html){ return /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, function(m){return m+HEAD;}) : HEAD+html; }
  setTheme(theme());
  function b64(buf){return btoa(String.fromCharCode.apply(null,new Uint8Array(buf)));}
  function unb64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
  function toast(t){var el=document.getElementById('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove('on');},2600);}
  function get(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  function put(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(e){}}

  async function fetchData(){
    var r1=await fetch('version.json',{cache:'no-cache'}); meta=await r1.json();
    var r2=await fetch('data.bin?v='+meta.version); return new Uint8Array(await r2.arrayBuffer());
  }
  async function keyFromPassword(pw){
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64(meta.salt),iterations:meta.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
  }
  async function decrypt(key,data){
    var iv=data.slice(0,12), body=data.slice(12);
    var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,body);
    return JSON.parse(new TextDecoder().decode(plain));
  }
  async function unlockWith(key,data,remember){
    var bundle=await decrypt(key,data);
    pages=bundle.pages; liveKey=key;
    if(remember){ put(KEYSTORE, JSON.stringify({salt:meta.salt,k:b64(await crypto.subtle.exportKey('raw',key))})); }
    document.getElementById('lock').style.display='none';
    document.getElementById('app').style.display='flex';
    document.getElementById('stamp').textContent='Updated '+bundle.built;
    var start=(location.hash||'').slice(1); show(pages[start]?start:'home');
  }
  function frame(){ var f=document.getElementById('view'), d=null; try{ d=f.contentDocument; }catch(e){} return {f:f,d:d,w:f.contentWindow}; }
  // Where you are on the current page: scroll position and which sections are open.
  function snap(){ var v=frame(); if(!v.d||!v.d.documentElement) return null;
    return {y:v.w.scrollY||v.d.documentElement.scrollTop||0, det:[].map.call(v.d.querySelectorAll('details'),function(x){return x.open?'1':'0';}).join('')}; }
  function restore(s){ var v=frame(); if(!v.d||!s) return; var r=v.d.documentElement;
    var ds=v.d.querySelectorAll('details'); if(ds.length===s.det.length) [].forEach.call(ds,function(x,i){ x.open=s.det.charAt(i)==='1'; });
    var go=function(){ var sb=r.style.scrollBehavior; r.style.scrollBehavior='auto'; v.w.scrollTo(0,s.y); r.style.scrollBehavior=sb; };
    go(); setTimeout(go,80); setTimeout(go,300); }
  function remember(){ var top=stack[stack.length-1]; if(top&&top.n===current) top.s=snap(); }
  function busy(){ var v=frame(); return !!(v.d&&v.d.documentElement&&v.d.documentElement.dataset.busy); }
  // Light/dark: change it inside the open page, so nothing reloads and running tools (CPR beat) keep going.
  function themeFrame(){ var v=frame(); if(!v.d||!v.d.documentElement) return; var t=theme(), r=v.d.documentElement;
    if(t==='auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme',t); }
  function show(name,hash,opt){
    opt=opt||{}; var p=pages[name]; if(!p){toast('That page is not in the phone app.');return;}
    if(!opt.noPush){ remember(); if(!stack.length||stack[stack.length-1].n!==name) stack.push({n:name}); }
    current=name;
    document.getElementById('title').textContent= name==='home' ? 'Field Notes' : p.title;
    var f=document.getElementById('view');
    f.onload=function(){ var d=f.contentDocument;
      if(opt.state){ restore(opt.state); }
      else if(hash){ var t=d&&d.getElementById(hash); if(t){ for(var n=t;n;n=n.parentElement){ if(n.tagName==='DETAILS') n.open=true; } t.scrollIntoView(); } } };
    f.srcdoc=inject(p.html);
    document.getElementById('back').hidden = stack.length<2;
    document.getElementById('home').hidden = name==='home';
    history.replaceState(null,'','#'+name);
  }
  window.addEventListener('message',function(e){
    var m=e.data||{};
    if(m.go) show(m.go,m.hash);
    else if(m.ext){ if(/^tel:|^sms:|^mailto:/.test(m.ext)) location.href=m.ext; else window.open(m.ext,'_blank'); }
    else if(m.missing) toast('That file is on the Mac and the ES_BACKUP drive, not in the phone app.');
  });
  // When the app comes back to the foreground, pick up any newer version quietly.
  document.addEventListener('visibilitychange',async function(){
    if(document.visibilityState!=='visible'||!liveKey) return;
    try{ var r=await fetch('version.json',{cache:'no-store'}); var m=await r.json(); if(!meta||m.version===meta.version) return;
      if(m.salt!==meta.salt){ put(KEYSTORE,null); location.reload(); return; }
      meta=m; var d=new Uint8Array(await (await fetch('data.bin?v='+m.version)).arrayBuffer()); var b=await decrypt(liveKey,d);
      pages=b.pages; document.getElementById('stamp').textContent='Updated '+b.built;
      // Never interrupt a running tool; the update shows up on the next page you open.
      if(!busy()) show(pages[current]?current:'home',null,{noPush:true,state:snap()}); toast('Updated to the latest version.');
    }catch(e){}
  });
  document.getElementById('home').onclick=function(){stack=[];show('home');};
  document.getElementById('themeBtn').onclick=function(){ var n={auto:'light',light:'dark',dark:'auto'}[theme()]; setTheme(n);
    toast(n==='auto'?'Theme: matches your phone':'Theme: '+(n==='light'?'Light':'Dark')); themeFrame(); };
  document.getElementById('back').onclick=function(){ if(stack.length>1){ stack.pop(); var top=stack[stack.length-1]; show(top.n,null,{noPush:true,state:top.s}); } };

  document.getElementById('form').addEventListener('submit',async function(e){
    e.preventDefault(); var err=document.getElementById('err'); err.textContent='Unlocking…';
    try{ var data=await fetchData(); var key=await keyFromPassword(document.getElementById('pw').value);
      await unlockWith(key,data,document.getElementById('rem').checked); err.textContent=''; }
    catch(x){ err.textContent = (x && x.name==='OperationError') ? 'Wrong password.' : 'Could not load the app. If you are offline, open it once with internet first.'; }
  });

  (async function(){
    if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js'); }catch(e){} }
    var saved=get(KEYSTORE); if(!saved) return;
    try{ var s=JSON.parse(saved); var data=await fetchData();
      if(s.salt!==meta.salt) throw new Error('password changed');
      var key=await crypto.subtle.importKey('raw',unb64(s.k),{name:'AES-GCM'},true,['decrypt']);
      await unlockWith(key,data,false);
    }catch(e){ put(KEYSTORE,null); }
  })();
})();
</script>
</body>
</html>
